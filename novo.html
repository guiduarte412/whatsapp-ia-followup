<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Detalhe do lead — Fourcon | FourAgro</title>
<link rel="stylesheet" href="/estilo.css">
</head>
<body>
<div class="container">
  <a class="voltar" href="/index.html">← Voltar</a>
  <header class="topo">
    <div>
      <p class="marca">Fourcon | FourAgro</p>
      <h1 id="nome">—</h1>
    </div>
  </header>

  <div id="resumo"></div>
  <div class="conversa" id="conversa"></div>
</div>

<script>
const LABELS_STATUS = {
  sequence_active: 'Sequência ativa (follow-up automático)',
  conversa_ia: 'IA conversando com o lead',
  human_handoff: 'Aguardando você assumir',
  cold_nurture: 'Nutrição futura (sem resposta)',
};

const LABELS_PRODUTO = {
  agro: 'Agro/rural',
  imoveis: 'Imóveis',
  caminhoes: 'Caminhões',
  credito_empresarial: 'Crédito empresarial',
};

function formatarHora(iso) {
  if (!iso) return '';
  return new Date(iso).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
}

async function carregar() {
  const params = new URLSearchParams(window.location.search);
  const telefone = params.get('telefone');
  if (!telefone) {
    document.getElementById('resumo').textContent = 'Telefone não informado.';
    return;
  }

  const resp = await fetch(`/api/leads/${encodeURIComponent(telefone)}`);
  if (!resp.ok) {
    document.getElementById('resumo').textContent = 'Lead não encontrado.';
    return;
  }
  const lead = await resp.json();

  document.getElementById('nome').textContent = lead.nome || telefone;
  document.getElementById('resumo').innerHTML = `
    <span class="status ${lead.status}"><span class="ponto"></span>${LABELS_STATUS[lead.status] || lead.status}</span>
    &nbsp;·&nbsp; ${LABELS_PRODUTO[lead.produto] || lead.produto || '—'}
    &nbsp;·&nbsp; <span class="telefone" style="font-family: var(--font-mono); font-size: 13px;">${lead.phone}</span>
  `;

  const conversaDiv = document.getElementById('conversa');
  const mensagensSequencia = (lead.mensagensEnviadas || []).map((texto) => ({ de: 'ia', texto, timestamp: null }));
  const conversa = lead.conversa && lead.conversa.length ? lead.conversa : mensagensSequencia;

  if (!conversa.length) {
    conversaDiv.innerHTML = '<p style="color: var(--ink-soft);">Nenhuma mensagem trocada ainda.</p>';
    return;
  }

  conversaDiv.innerHTML = conversa.map((m) => `
    <div class="bolha ${m.de === 'lead' ? 'lead' : 'ia'}">
      ${m.texto}
      ${m.timestamp ? `<span class="hora">${formatarHora(m.timestamp)}</span>` : ''}
    </div>
  `).join('');
}

carregar();
</script>
</body>
</html>
